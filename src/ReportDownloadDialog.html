<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--btn:#2563eb;--btnHover:#1d4ed8;--border:#e5e7eb;--muted:#6b7280}
html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.card{width:100%;max-width:520px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-sizing:border-box}
.title{margin:0 0 6px;font-size:20px}
.sub{margin:0 0 16px;color:var(--muted)}
.file{padding:10px 12px;background:#f9fafb;border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.actions{display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px}
.btn:hover{background:var(--btnHover)}
.icon{width:16px;height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2 class="title">Download XLSX report</h2>
    <p class="sub">The report is ready. Click the button to download it.</p>
    <div class="file"><span class="pill"><?!= filename ?></span></div>
    <div class="actions">
      <a class="btn" href="<?!= downloadUrl ?>" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v10m0 0 4-4m-4 4-4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 15v4h14v-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download
      </a>
    </div>
    <div class="hint" style="margin-top:12px;color:var(--muted);font-size:12px;text-align:center">The download opens in a new tab.</div>
  </div>
</div>
</body>
</html>
